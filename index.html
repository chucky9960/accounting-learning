let historyStack=[],currentPage='home',curQ=null,done=0,right=0,practiceChapterFilter=null,answered=false,queue=[],queuePos=0,practiceOrigin='home';
function readJSON(k,d=[]){try{let v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:d}catch(e){return d}}function getScope(){return readJSON('examScope',[])}
function show(id,push=true){if(push&&id!==currentPage)historyStack.push(currentPage);currentPage=id;document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));document.getElementById(id)?.classList.add('on');document.querySelectorAll('.nav button').forEach(e=>e.classList.toggle('on',e.dataset.page===id));localStorage.setItem('lastPage',id);window.scrollTo(0,0);if(id==='wrong')renderWrong();if(id==='home')renderHome();if(id==='chapters')renderChapters();if(id==='scope')renderScope()}
function go(id){show(id,true)}function back(){let id=historyStack.pop()||'home';show(id,false)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function renderHome(){let s=getScope();document.getElementById('scopeSummary').innerHTML=s.length?`本次已設定 <b>${s.length} 章</b>：${s.map(i=>'第'+(i+1)+'章').join('、')}`:'尚未設定考試範圍。直接練習會使用目前全部題庫。';let last=Number(localStorage.getItem('lastChapter'));let lastPage=localStorage.getItem('lastPage');let html='';if(Number.isInteger(last)&&C[last])html+=`<button class="primary" onclick="openLesson(${last})">繼續上次學習：第${last+1}章｜${C[last][0]}</button>`;if(lastPage==='practice')html+=`<div class="muted" style="margin-top:8px">上次離開時正在練習；題目作答紀錄會持續保存錯題。</div>`;document.getElementById('resumeBox').innerHTML=html}
function renderChapters(){let s=getScope();document.getElementById('chapterList').innerHTML=C.map((c,i)=>`<button class="chapterBtn" onclick="openLesson(${i})"><span><b>${s.includes(i)?'★ ':''}第${i+1}章｜${c[0]}</b><span class="muted">${c[1]}</span></span><span class="arrow">›</span></button>`).join('')}
function renderScope(){let saved=getScope();document.getElementById('scopeList').innerHTML=C.map((c,i)=>`<label class="scopeRow"><input class="scopeBox" type="checkbox" value="${i}" ${saved.includes(i)?'checked':''}><span><b>第${i+1}章｜${c[0]}</b><br><span class="muted">${c[1]}</span></span></label>`).join('')}
function openLesson(i){if(!C[i])return;localStorage.setItem('lastChapter',i);let content;if(i===0){content=`<div class="card lesson"><span class="tag">第1章</span><h2 style="margin-top:9px">會計基本概念</h2><p class="muted">本章考前核心：先理解五大要素與會計等式，再做交易分析。不要一開始就硬背借貸。</p>${ch1Topics.map(t=>`<div class="topic"><h3>${t[0]}</h3><div class="box">${t[1]}</div></div>`).join('')}<div class="formula"><b>核心公式：資產＝負債＋權益</b><br>收入 → 權益增加；費用 → 權益減少。</div><div class="journal"><b>解題順序</b><br>① 找交易中的科目 → ② 分五大要素 → ③ 判斷增加／減少 → ④ 檢查會計等式 → ⑤ 學到借貸章後再決定借貸方向。</div><button class="primary" onclick="practiceChapter(0)">開始第1章完整練習（30題）</button></div>`}else{let b=basicLessons[i-1];content=`<div class="card lesson"><span class="tag">第${i+1}章</span><h2 style="margin-top:9px">${C[i][0]}</h2><p class="muted">考前重點：${C[i][1]}</p><h3>先理解</h3><div class="box">${b[0]}</div><h3>核心提醒</h3><div class="formula">${b[1]}</div><div class="notice">本章正式題庫與細分考點正在依同一規格擴充；目前第1章已完成30題正式題組。</div><button class="primary" onclick="practiceChapter(${i})">練習本章目前題目</button></div>`}document.getElementById('lessonBody').innerHTML=content;go('lesson')}
function setAll(v){document.querySelectorAll('.scopeBox').forEach(e=>e.checked=v)}function saveScope(){let v=[...document.querySelectorAll('.scopeBox:checked')].map(e=>+e.value);localStorage.setItem('examScope',JSON.stringify(v));document.getElementById('saveStatus').innerHTML=`<div class="feedback">✓ 已儲存 ${v.length} 章。</div>`;renderHome();renderChapters()}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function poolForPractice(){if(Number.isInteger(practiceChapterFilter))return Q.filter(q=>q.c===practiceChapterFilter);let s=getScope();return s.length?Q.filter(q=>s.includes(q.c)):Q}
function beginPractice(filter){practiceOrigin=currentPage;practiceChapterFilter=filter;done=0;right=0;answered=false;queue=shuffle(poolForPractice());queuePos=0;updateStats();go('practice');loadQuestion()}
function startPractice(){beginPractice(null)}function practiceChapter(i){beginPractice(i)}
function loadQuestion(){answered=false;if(!queue.length){document.getElementById('quiz').innerHTML='<div class="feedback"><b>這個範圍目前沒有題目。</b></div>';document.getElementById('nextBtn').style.display='none';document.getElementById('progress').textContent='';return}if(queuePos>=queue.length){finishPractice();return}curQ=queue[queuePos];document.getElementById('nextBtn').style.display='none';document.getElementById('progress').textContent=`第 ${queuePos+1} / ${queue.length} 題`;document.getElementById('quiz').innerHTML=`<div class="tag">第${curQ.c+1}章｜${C[curQ.c][0]}</div><h3>${curQ.q}</h3>${curQ.a.map((x,i)=>`<button class="answer" onclick="answer(${i},this)">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}<div id="fb"></div>`;localStorage.setItem('lastPracticeChapter',String(curQ.c))}
function answer(i,el){if(answered)return;answered=true;done++;let ok=i===curQ.x;if(ok)right++;let bs=[...document.querySelectorAll('#quiz .answer')];bs[curQ.x]?.classList.add('correct');if(!ok){el.classList.add('wrong');let w=readJSON('wrongQuestions',[]).filter(z=>z.q!==curQ.q);w.unshift({q:curQ.q,e:curQ.e,c:curQ.c});localStorage.setItem('wrongQuestions',JSON.stringify(w.slice(0,100)))}document.getElementById('fb').innerHTML=`<div class="feedback"><b>${ok?'✓ 答對':'✗ 答錯'}</b><br>${curQ.e}</div>`;updateStats();document.getElementById('nextBtn').style.display='block';document.getElementById('nextBtn').textContent=queuePos===queue.length-1?'查看本次結果':'下一題'}
function nextQuestion(){if(!answered)return;queuePos++;loadQuestion()}function updateStats(){document.getElementById('doneN').textContent=done;document.getElementById('rightN').textContent=right;document.getElementById('rateN').textContent=done?Math.round(right/done*100)+'%':'—'}
function finishPractice(){let pct=done?Math.round(right/done*100):0;document.getElementById('progress').textContent='本次完成';document.getElementById('quiz').innerHTML=`<div class="feedback"><h2>完成練習</h2><b>${done} 題答對 ${right} 題｜正確率 ${pct}%</b><br><br>${pct>=80?'基礎掌握度不錯，建議重做錯題確認。':'建議先重做錯題，再回章節複習觀念。'}<br><button class="secondary" onclick="restartPractice()">重新練習本次範圍</button><button class="secondary" onclick="go('wrong')">重做錯題</button></div>`;document.getElementById('nextBtn').style.display='none'}function restartPractice(){done=0;right=0;queue=shuffle(poolForPractice());queuePos=0;updateStats();loadQuestion()}
function renderWrong(){let w=readJSON('wrongQuestions',[]);document.getElementById('wrongList').innerHTML=w.length?w.map((x,idx)=>`<div class="box"><span class="tag">第${x.c+1}章</span><br><b>${x.q}</b><br><span class="muted">解析：${x.e}</span><br><button class="secondary" onclick="retryWrong(${idx})">重做這題</button></div>`).join(''):'<div class="empty">目前沒有錯題。<br>答錯後會自動收進來。</div>'}
function retryWrong(idx){let w=readJSON('wrongQuestions',[]),item=w[idx];if(!item)return;let q=Q.find(z=>z.q===item.q);if(!q)return;practiceChapterFilter=q.c;queue=[q];queuePos=0;done=0;right=0;updateStats();go('practice');loadQuestion()}function clearWrong(){if(confirm('確定清除全部錯題紀錄？')){localStorage.removeItem('wrongQuestions');renderWrong()}}
renderScope();renderChapters();renderHome();updateStats();
</script></body></html>
