<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b5c"><title>會計學習｜正式考前版</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#182734;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.top{background:#173b5c;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px}.top h1{margin:0;font-size:27px}.top p{margin:4px 0 0;color:#d8e5ef}.wrap{max-width:1080px;margin:auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}.card{background:#fff;border:1px solid #dce5ec;border-radius:17px;padding:17px;margin-bottom:13px;box-shadow:0 2px 8px #173b5c0c}h2{margin:0 0 10px;font-size:23px}h3{margin:17px 0 8px}.muted{color:#687a88;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.big,.chapterBtn,.primary,.answer,.secondary,.back{cursor:pointer}.big{border:0;border-radius:14px;padding:16px;text-align:left;background:#eaf2f8;color:#173b5c;font-size:16px;font-weight:800}.chapterBtn{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;border-bottom:1px solid #e8eef2;background:#fff;text-align:left;padding:15px 3px;font-size:17px}.primary{width:100%;border:0;background:#173b5c;color:#fff;border-radius:13px;padding:14px;font-size:17px;font-weight:800;margin-top:10px}.secondary,.back{border:1px solid #c8d5de;background:#fff;border-radius:11px;padding:9px 12px;font-size:15px;margin:3px}.back{margin:0 0 11px;background:#eaf2f8;color:#275a7b;font-weight:800}.tag{display:inline-block;font-size:13px;background:#edf4f8;color:#48687d;padding:4px 8px;border-radius:20px}.notice{background:#fff8e8;border-radius:12px;padding:11px;margin-bottom:12px;color:#765b19}.box{background:#f5f8fa;border-radius:13px;padding:14px;margin:11px 0}.formula{background:#fff8e8;border-left:5px solid #e6ae3a;padding:13px;border-radius:10px;margin:11px 0}.lesson{line-height:1.72}.scopeRow{display:flex;gap:11px;align-items:center;padding:12px 2px;border-bottom:1px solid #e8eef2}.scopeRow input{width:24px;height:24px}.answer{display:block;width:100%;text-align:left;padding:13px;margin:8px 0;border-radius:12px;background:#f4f7f9;border:1px solid #d8e2e9;font-size:16px}.answer.correct{background:#e8f5ec;border-color:#80b690}.answer.wrong{background:#fff0ef;border-color:#d99b96}.feedback{padding:12px;border-radius:12px;margin-top:10px;background:#f4f7f9}.stats{display:flex;gap:7px}.stat{flex:1;background:#f3f7fa;border-radius:12px;padding:10px 4px;text-align:center;font-size:13px}.stat b{display:block;font-size:22px;color:#173b5c}.progress{font-size:14px;font-weight:800;color:#49677b;margin:11px 0}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dce4ea;display:flex;padding:6px 3px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}.nav button{width:20%;border:0;background:transparent;padding:6px 1px;color:#435765;font-weight:800;font-size:11px}.nav span{display:block;font-size:21px}.nav .on{color:#173b5c;background:#eaf2f8;border-radius:13px}.page{display:none}.page.on{display:block}.empty{text-align:center;padding:26px;color:#6c7d89}.chapterNav{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.bankbar{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.bankstat{background:#eef4f8;border-radius:12px;padding:10px;text-align:center}.bankstat b{display:block;font-size:22px;color:#173b5c}@media(min-width:800px){.wrap{padding:24px}.desktop{display:grid;grid-template-columns:230px 1fr;gap:20px}.nav{position:sticky;top:18px;display:block;border:0;border-radius:17px;padding:8px;height:max-content}.nav button{width:100%;text-align:left;font-size:15px;padding:12px}.nav span{display:inline-block;width:30px;font-size:18px}.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr}.top{padding-bottom:12px}.top h1{font-size:24px}.card{padding:14px}.wrap{padding:11px 11px calc(91px + env(safe-area-inset-bottom))}.bankbar{grid-template-columns:1fr 1fr 1fr}.bankstat{font-size:12px;padding:8px 2px}.bankstat b{font-size:19px}}@media(max-height:600px) and (max-width:600px){.top{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:8px}.top p{display:none}.wrap{padding-top:8px}.card{margin-bottom:8px}.answer{padding:10px}.nav span{font-size:18px}}</style></head><body><header class="top"><h1>會計學習</h1><p>正式考前版 · 第十三版教材架構</p></header><div class="wrap desktop"><nav class="nav"><button data-page="home"><span>⌂</span>首頁</button><button data-page="chapters"><span>▤</span>章節</button><button data-page="scope"><span>✓</span>範圍</button><button data-page="practice"><span>✎</span>練習</button><button data-page="wrong"><span>!</span>錯題</button></nav><main><section id="home" class="page"><div class="card"><h2>考前學習</h2><div id="bankStats" class="bankbar"></div><div id="scopeSummary" class="notice"></div><div class="grid"><button class="big" onclick="go('scope')">✓ 設定考試範圍</button><button class="big" onclick="go('chapters')">📖 章節學習</button><button class="big" onclick="startMode('scope')">✎ 範圍完整練習</button><button class="big" onclick="startMode('essence')">★ 精髓題練習</button><button class="big" onclick="startMode('quick')">⚡ 快速10題</button><button class="big" onclick="startMode('standard')">🎯 標準30題</button><button class="big" onclick="go('wrong')">! 查看錯題</button></div><div id="resumeBox"></div></div><div class="card lesson"><h2>借貸核心規則</h2><div class="formula"><b>資產、費用增加 → 借方</b><br><b>負債、權益、收入增加 → 貸方</b></div><p>先判斷科目屬性，再判斷增加或減少；不要把「借」直接等同增加。</p></div></section><section id="chapters" class="page"><button class="back" onclick="goBack()">← 返回上一步</button><div class="card"><h2>章節學習</h2><div id="chapterList"></div></div></section><section id="lesson" class="page"><button class="back" onclick="goBack()">← 返回上一步</button><div id="lessonBody"></div></section><section id="scope" class="page"><button class="back" onclick="goBack()">← 返回上一步</button><div class="card"><h2>本次考試範圍</h2><button class="secondary" onclick="setAll(true)">全部勾選</button><button class="secondary" onclick="setAll(false)">全部清除</button><div id="scopeList"></div><button class="primary" onclick="saveScope()">儲存考試範圍</button><div id="saveStatus"></div></div></section><section id="practice" class="page"><button class="back" onclick="goBack()">← 返回上一步</button><div class="card"><h2 id="practiceTitle">題目練習</h2><div class="stats"><div class="stat"><b id="doneN">0</b>已作答</div><div class="stat"><b id="rightN">0</b>答對</div><div class="stat"><b id="rateN">—</b>正確率</div></div><div id="progress" class="progress"></div><div id="quiz"></div><button id="nextBtn" class="primary" onclick="nextQuestion()">下一題</button></div></section><section id="wrong" class="page"><button class="back" onclick="goBack()">← 返回上一步</button><div class="card"><h2>我的錯題</h2><button class="secondary" onclick="clearWrong()">清除全部錯題</button><div id="wrongList"></div></div></section></main></div><script src="question-bank.js"></script><script>
const C=[['會計基本概念','會計目的、五大要素、會計等式、交易分析'],['借貸法則與會計記錄','借貸、分錄、過帳、試算'],['調整與編表','應計、遞延、折舊、調整分錄'],['買賣業會計','進貨、銷貨、銷貨成本、折扣退回'],['現金與銀行存款','現金控制、銀行存款調節'],['應收款項','應收帳款、備抵損失、票據'],['存貨','成本流動、FIFO、加權平均、淨變現價值'],['流動負債及或有事項','應付、短期負債、估計負債'],['會計原則','認列、衡量、表達與揭露'],['固定資產與無形資產','取得成本、折舊、處分、無形資產'],['股東權益','股本、資本公積、保留盈餘、股利'],['長期負債','公司債、溢折價、利息'],['投資','債券投資、權益投資、衡量'],['現金流量表','營業、投資、籌資活動'],['財務報表分析','水平、垂直、比率分析']];
const lessons=[['會計用來辨認、衡量、記錄與報導企業經濟活動。先掌握五大要素，再學交易分析。','資產＝負債＋權益。收入增加權益，費用降低權益。'],['借貸是記錄位置，不是日常語言的借錢。','資產、費用增加記借方；負債、權益、收入增加記貸方。'],['期末要把真正屬於本期的收入與費用放回本期。','先判斷本期已賺得或已耗用多少，再做調整。'],['買賣業多了商品存貨與銷貨成本。','永續盤存制銷貨通常同時記收入與銷貨成本。'],['公司帳與銀行帳可能有時間差。','逐項核對未兌現支票、在途存款與銀行已記公司未記項目。'],['賒銷形成收款權利，也要考慮信用損失。','分清應收帳款、票據及備抵相關處理。'],['存貨金額直接影響銷貨成本與淨利。','期初存貨＋進貨＝銷貨成本＋期末存貨。'],['負債代表企業現時義務。','先判斷義務是否存在、何時清償及是否需估計。'],['會計原則協助判斷何時認列、如何衡量與表達。','先看交易實質，再套用適當原則。'],['長期使用資產的成本通常跨期分攤。','直線法折舊＝（成本－殘值）÷耐用年限。'],['權益是資產扣除負債後歸屬股東的剩餘。','分清股東投入、企業賺得與對股東分配。'],['長期負債常涉及利息與溢折價。','有效利息法常以期初攤銷後成本×有效利率。'],['投資處理取決於工具性質與分類。','先辨認債務或權益工具，再判斷衡量。'],['現金流量表說明現金從哪裡來、用到哪裡。','分成營業、投資、籌資活動。'],['財報分析不是只算比率，而是解讀企業狀況。','比率需搭配期間、同業及結構比較。']];
const Q=window.QBANK||[];let currentPage='home',stack=[],lessonIndex=null,pool=[],pos=0,curQ=null,answered=false,done=0,right=0,mode='scope';
function read(k,d=[]){try{let v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:d}catch{return d}}function scope(){return read('examScope',[])}
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.page===id));currentPage=id;if(id==='home')renderHome();if(id==='chapters')renderChapters();if(id==='wrong')renderWrong();window.scrollTo(0,0)}
function go(id){if(id!==currentPage)stack.push({p:currentPage,l:lessonIndex});show(id)}function goBack(){let s=stack.pop();if(!s){show('home');return}lessonIndex=s.l;if(s.p==='lesson'&&Number.isInteger(lessonIndex))renderLesson(lessonIndex,false);else show(s.p)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function renderHome(){let st=window.QBANK_STATS?QBANK_STATS():{total:Q.length,essence:Q.filter(q=>q.essence).length};bankStats.innerHTML=`<div class="bankstat"><b>${st.total}</b>目前題庫</div><div class="bankstat"><b>${st.essence}</b>精髓題</div><div class="bankstat"><b>15</b>章節</div>`;let s=scope();scopeSummary.innerHTML=s.length?`本次範圍：<b>${s.length}章</b>｜${s.map(i=>'第'+(i+1)+'章').join('、')}`:'尚未設定考試範圍；可先設定，或直接使用全題庫模式。';let last=Number(localStorage.getItem('lastChapter'));resumeBox.innerHTML=Number.isInteger(last)&&C[last]?`<button class="primary" onclick="openLesson(${last})">繼續上次學習：第${last+1}章｜${C[last][0]}</button>`:''}
function renderChapters(){let s=scope();chapterList.innerHTML=C.map((c,i)=>{let n=Q.filter(q=>q.c===i).length;return `<button class="chapterBtn" onclick="openLesson(${i})"><span><b>${s.includes(i)?'★ ':''}第${i+1}章｜${c[0]}</b><br><span class="muted">${c[1]}｜目前 ${n} 題</span></span><span>›</span></button>`}).join('')}
function openLesson(i){stack.push({p:currentPage,l:lessonIndex});renderLesson(i,true)}function renderLesson(i){lessonIndex=i;localStorage.setItem('lastChapter',i);let c=C[i],l=lessons[i],n=Q.filter(q=>q.c===i).length,e=Q.filter(q=>q.c===i&&q.essence).length;lessonBody.innerHTML=`<div class="card lesson"><span class="tag">第${i+1}章</span><h2>${c[0]}</h2><p class="muted">${c[1]}</p><h3>先理解</h3><div class="box">${l[0]}</div><h3>必記核心</h3><div class="formula">${l[1]}</div><div class="notice">本章目前題庫 <b>${n}</b> 題｜精髓 <b>${e}</b> 題</div><button class="primary" onclick="startChapter(${i},false)">完整練習本章</button><button class="primary" onclick="startChapter(${i},true)">只練本章精髓題</button><div class="chapterNav">${i?`<button class="secondary" onclick="renderLesson(${i-1})">← 第${i}章</button>`:'<span></span>'}${i<14?`<button class="secondary" onclick="renderLesson(${i+1})">第${i+2}章 →</button>`:''}</div></div>`;show('lesson')}
function renderScope(){let s=scope();scopeList.innerHTML=C.map((c,i)=>`<label class="scopeRow"><input class="scopeBox" type="checkbox" value="${i}" ${s.includes(i)?'checked':''}><span><b>第${i+1}章｜${c[0]}</b><br><span class="muted">${c[1]}</span></span></label>`).join('')}function setAll(v){document.querySelectorAll('.scopeBox').forEach(x=>x.checked=v)}function saveScope(){let s=[...document.querySelectorAll('.scopeBox:checked')].map(x=>+x.value);localStorage.setItem('examScope',JSON.stringify(s));saveStatus.innerHTML=`<div class="feedback">✓ 已儲存 ${s.length} 章</div>`;renderChapters()}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startMode(m){mode=m;let s=scope(),base=s.length?Q.filter(q=>s.includes(q.c)):Q;if(m==='essence')base=base.filter(q=>q.essence);pool=shuffle(base);if(m==='quick')pool=pool.slice(0,10);if(m==='standard')pool=pool.slice(0,30);begin(m==='essence'?'精髓題練習':m==='quick'?'快速10題':m==='standard'?'標準30題':'範圍完整練習')}
function startChapter(i,ess){pool=shuffle(Q.filter(q=>q.c===i&&(!ess||q.essence)));begin(`第${i+1}章｜${ess?'精髓題':'完整練習'}`)}function begin(title){stack.push({p:currentPage,l:lessonIndex});done=right=pos=0;practiceTitle.textContent=title;show('practice');updateStats();nextQuestion()}
function nextQuestion(){if(!pool.length){quiz.innerHTML='<div class="feedback">此範圍目前尚無題目。</div>';nextBtn.style.display='none';return}if(pos>=pool.length){quiz.innerHTML=`<div class="feedback"><h3>本輪完成</h3>共 ${done} 題，答對 ${right} 題，正確率 ${done?Math.round(right/done*100):0}%。</div>`;progress.textContent='已完成';nextBtn.style.display='none';return}curQ=pool[pos++];answered=false;nextBtn.style.display='block';progress.textContent=`第 ${pos} / ${pool.length} 題｜第${curQ.c+1}章｜${curQ.topic}｜${curQ.type}${curQ.essence?'｜★精髓':''}`;quiz.innerHTML=`<h3>${curQ.q}</h3>${curQ.a.map((a,i)=>`<button class="answer" onclick="answer(${i},this)">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}<div id="fb"></div>`}
function answer(i,el){if(answered)return;answered=true;done++;let ok=i===curQ.x;if(ok)right++;let bs=[...document.querySelectorAll('#quiz .answer')];bs[curQ.x]?.classList.add('correct');if(!ok){el.classList.add('wrong');let w=read('wrongQuestions',[]).filter(x=>x.id!==curQ.id);w.unshift({id:curQ.id,c:curQ.c,q:curQ.q,e:curQ.e});localStorage.setItem('wrongQuestions',JSON.stringify(w.slice(0,500)))}fb.innerHTML=`<div class="feedback"><b>${ok?'✓ 答對':'✗ 答錯'}</b><br>${curQ.e}</div>`;updateStats()}
function updateStats(){doneN.textContent=done;rightN.textContent=right;rateN.textContent=done?Math.round(right/done*100)+'%':'—'}
function renderWrong(){let w=read('wrongQuestions',[]);wrongList.innerHTML=w.length?w.map(x=>`<div class="box"><span class="tag">第${x.c+1}章</span><br><b>${x.q}</b><br><span class="muted">${x.e}</span><br><button class="secondary" onclick="retry('${x.id}')">重做</button></div>`).join(''):'<div class="empty">目前沒有錯題。</div>'}function retry(id){let q=Q.find(x=>x.id===id);if(!q)return;pool=[q];begin('錯題重做')}function clearWrong(){if(confirm('確定清除全部錯題？')){localStorage.removeItem('wrongQuestions');renderWrong()}}
renderScope();renderChapters();show('home');
</script></body></html>
