<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b5c"><title>會計學習｜考前版</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#182734;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;font-size:18px}.top{background:#173b5c;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 20px}.top h1{margin:0;font-size:30px}.top p{margin:5px 0 0;color:#d8e5ef}.wrap{max-width:1080px;margin:auto;padding:16px 16px calc(105px + env(safe-area-inset-bottom))}.card{background:#fff;border:1px solid #dce5ec;border-radius:18px;padding:19px;margin-bottom:15px;box-shadow:0 2px 8px #173b5c0c}h2{margin:0 0 12px;font-size:24px}h3{font-size:20px;margin:18px 0 8px}.muted{color:#687a88;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big,.chapterBtn,.primary,.answer{border:0;cursor:pointer}.big{border-radius:15px;padding:17px;text-align:left;background:#eaf2f8;color:#173b5c;font-size:17px;font-weight:800}.chapterBtn{width:100%;display:flex;align-items:center;justify-content:space-between;background:#fff;text-align:left;padding:17px 4px;border-bottom:1px solid #e8eef2;font-size:18px;color:#182734}.chapterBtn b{display:block}.arrow{font-size:25px;color:#668094}.tag{display:inline-block;font-size:13px;background:#edf4f8;color:#48687d;padding:4px 8px;border-radius:20px}.lesson{line-height:1.75}.box{background:#f5f8fa;border-radius:14px;padding:15px;margin:12px 0}.formula{background:#fff8e8;border-left:5px solid #e6ae3a;padding:14px;border-radius:10px;margin:12px 0}.journal{background:#eef5f0;border-left:5px solid #5b9270;padding:14px;border-radius:10px;line-height:1.8}.primary{width:100%;background:#173b5c;color:#fff;border-radius:14px;padding:15px;font-size:18px;font-weight:800;margin-top:12px}.secondary{border:1px solid #c8d5de;background:#fff;border-radius:12px;padding:10px 13px;font-size:16px;margin:3px;cursor:pointer}.scopeRow{display:flex;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid #e8eef2}.scopeRow input{width:25px;height:25px;flex:none}.answer{display:block;width:100%;text-align:left;padding:14px;margin:9px 0;border-radius:12px;background:#f4f7f9;border:1px solid #d8e2e9;font-size:17px;color:#172733}.answer.correct{background:#e8f5ec;border-color:#80b690}.answer.wrong{background:#fff0ef;border-color:#d99b96}.feedback{padding:13px;border-radius:12px;margin-top:10px;background:#f4f7f9}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dce4ea;display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom));justify-content:space-around}.nav button{width:20%;border:0;background:transparent;padding:7px 1px;color:#435765;font-weight:800;font-size:12px;cursor:pointer}.nav span{display:block;font-size:23px}.nav .on{color:#173b5c;background:#eaf2f8;border-radius:14px}.page{display:none}.page.on{display:block}.back{border:0;background:none;color:#275a7b;font-size:17px;font-weight:700;padding:3px 0 14px;cursor:pointer}.stats{display:flex;gap:10px}.stat{flex:1;background:#f3f7fa;border-radius:13px;padding:13px;text-align:center}.stat b{display:block;font-size:25px;color:#173b5c}.empty{text-align:center;padding:30px;color:#6c7d89}.chapterNav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.notice{background:#fff8e8;border-radius:12px;padding:12px;margin-bottom:14px;color:#765b19}.resume{margin-top:12px}@media(min-width:800px){.wrap{padding:26px}.desktop{display:grid;grid-template-columns:240px 1fr;gap:22px}.nav{position:sticky;top:20px;display:block;border:0;border-radius:18px;padding:8px;height:max-content}.nav button{width:100%;text-align:left;font-size:16px;padding:13px}.nav span{display:inline-block;width:32px;font-size:19px}.grid{grid-template-columns:repeat(4,1fr)}.content{min-width:0}}@media(max-width:420px){.grid{grid-template-columns:1fr}.top h1{font-size:27px}.card{padding:16px}}</style></head><body><header class="top"><h1>會計學習</h1><p>考前版 · 先理解，再練習</p></header><div class="wrap desktop"><nav class="nav"><button class="on" data-page="home"><span>⌂</span>首頁</button><button data-page="chapters"><span>▤</span>章節</button><button data-page="scope"><span>✓</span>範圍</button><button data-page="practice"><span>✎</span>練習</button><button data-page="wrong"><span>!</span>錯題</button></nav><main class="content"><section id="home" class="page on"><div class="card"><h2>考前學習</h2><p class="muted">先設定本次考試範圍，再讀章節與做題。進度、範圍、錯題都會保存在目前這台裝置。</p><div id="scopeSummary" class="notice"></div><div class="grid"><button class="big" onclick="go('scope')">✓ 設定考試範圍</button><button class="big" onclick="go('chapters')">📖 章節學習</button><button class="big" onclick="startPractice()">✎ 範圍練習</button><button class="big" onclick="go('wrong')">! 查看錯題</button></div><div id="resumeBox" class="resume"></div></div><div class="card lesson"><h2>借貸最重要規則</h2><div class="formula"><b>資產、費用增加 → 借方</b><br><b>負債、權益、收入增加 → 貸方</b></div><p>不要背「借＝增加、貸＝減少」。先判斷科目屬於資產、負債、權益、收入或費用，再判斷增加或減少。</p></div></section><section id="chapters" class="page"><div class="card"><h2>章節學習</h2><p class="muted">點整列即可進入。★ 代表已列入本次考試範圍。</p><div id="chapterList"></div></div></section><section id="lesson" class="page"><button class="back" onclick="go('chapters')">← 回章節</button><div id="lessonBody"></div></section><section id="scope" class="page"><div class="card"><h2>本次考試範圍</h2><p class="muted">可任意跳章勾選。儲存後，範圍練習只會從有題目的已勾選章節抽題。</p><button class="secondary" onclick="setAll(true)">全部勾選</button><button class="secondary" onclick="setAll(false)">全部清除</button><div id="scopeList"></div><button class="primary" onclick="saveScope()">儲存考試範圍</button><div id="saveStatus"></div></div></section><section id="practice" class="page"><div class="card"><h2>題目練習</h2><div class="stats"><div class="stat"><b id="doneN">0</b>本次作答</div><div class="stat"><b id="rightN">0</b>答對</div><div class="stat"><b id="rateN">—</b>正確率</div></div><div id="quiz" style="margin-top:18px"></div><button id="nextBtn" class="primary" onclick="nextQuestion()">下一題</button></div></section><section id="wrong" class="page"><div class="card"><h2>我的錯題</h2><button class="secondary" onclick="clearWrong()">清除全部錯題</button><div id="wrongList"></div></div></section></main></div><script>const C=[{n:'第1章',t:'會計基本概念',k:'五大要素、會計等式、交易分析',plain:'會計是在回答：企業有什麼、欠什麼、業主真正擁有多少，以及這段期間賺了多少。',rule:'資產＝負債＋權益。每一筆交易都必須維持等式平衡。',ex:'業主投入現金100,000：現金（資產）增加，同時資本（權益）增加。'},{n:'第2章',t:'借貸法則與會計記錄',k:'借貸、分錄、過帳、試算',plain:'借與貸只是會計記錄的左右位置，不是日常語言的借錢與貸款。',rule:'資產、費用增加記借方；負債、權益、收入增加記貸方。減少時方向相反。',ex:'現金支付租金10,000：借：租金費用10,000；貸：現金10,000。'},{n:'第3章',t:'調整與編表',k:'應計、遞延、折舊、調整分錄',plain:'期末不能只看有沒有收付現金，要把真正屬於本期的收入與費用放回本期。',rule:'先判斷有多少金額已經屬於本期，再調整資產、負債與收入、費用。',ex:'預付一年保險12,000，一個月到期：借保險費1,000；貸預付保險費1,000。'},{n:'第4章',t:'買賣業會計',k:'進貨、銷貨、銷貨成本、折扣退回',plain:'買賣業有商品存貨，因此賣商品時除了認列收入，也要把已售商品成本轉成銷貨成本。',rule:'永續盤存制銷貨通常有兩組分錄：認列銷貨收入，以及認列銷貨成本。',ex:'成本600商品售價1,000收現：借現金1,000貸銷貨收入1,000；借銷貨成本600貸存貨600。'},{n:'第5章',t:'現金與銀行存款',k:'現金控制、銀行存款調節',plain:'公司帳與銀行對帳單可能因時間差不同，要逐項找出差異。',rule:'銀行調節後，需要公司補做分錄的是公司帳上尚未記錄的項目。',ex:'銀行扣手續費100，公司未記：借銀行手續費100；貸銀行存款100。'},{n:'第6章',t:'應收款項',k:'應收帳款、備抵損失、票據',plain:'賒銷是先認列收入、之後收錢；同時要估計可能收不回的金額。',rule:'估計信用損失時借損失、貸備抵；實際沖銷時借備抵、貸應收帳款。',ex:'估計信用損失2,000：借預期信用減損損失2,000；貸備抵損失2,000。'},{n:'第7章',t:'存貨',k:'成本流動、FIFO、加權平均、淨變現價值',plain:'存貨計價會影響期末存貨，也會反方向影響銷貨成本與本期淨利。',rule:'期初存貨＋本期進貨＝可供銷售商品成本＝銷貨成本＋期末存貨。',ex:'期末存貨少算1,000 → 銷貨成本多算1,000 → 淨利少算1,000。'},{n:'第8章',t:'流動負債及或有事項',k:'應付、短期負債、估計負債',plain:'已經發生且企業有現時義務時，要判斷是否應認列負債。',rule:'負債增加通常記貸方；清償負債時借負債、貸現金。',ex:'賒購用品5,000：借用品5,000；貸應付帳款5,000。'},{n:'第9章',t:'會計原則',k:'認列、衡量、表達與揭露',plain:'遇到題目不只背分錄，也要知道財報資訊為什麼這樣認列與衡量。',rule:'先辨認交易實質，再判斷何時認列、用多少金額衡量，以及如何表達。',ex:'題目問何時認列收入或費用時，要先想到權責基礎。'},{n:'第10章',t:'固定資產與無形資產',k:'取得成本、折舊、處分、無形資產',plain:'長期使用的資產通常不是購買當期全部列費用，而是依受益期間分攤。',rule:'直線法折舊＝（成本－殘值）÷耐用年限。',ex:'設備100,000、殘值10,000、耐用5年：每年折舊18,000。'},{n:'第11章',t:'股東權益',k:'股本、資本公積、保留盈餘、股利',plain:'權益是資產扣掉負債後，歸屬業主或股東的剩餘權益。',rule:'收入會增加權益；費用與股利通常使權益減少。',ex:'宣告現金股利會形成應付股利，並使保留盈餘減少。'},{n:'第12章',t:'長期負債',k:'公司債、溢折價、利息',plain:'長期借款除了本金，還要處理利息及可能的溢折價攤銷。',rule:'有效利息法：利息費用＝期初攤銷後成本×有效利率。',ex:'票面利率與市場利率不同時，公司債發行價格通常不等於面額。'},{n:'第13章',t:'投資',k:'債券投資、權益投資、衡量',plain:'投資的會計處理取決於工具性質與分類，不是所有股票、債券都使用同一方法。',rule:'先辨認債務工具或權益工具，再判斷衡量分類及損益去向。',ex:'看到公允價值變動時，先判斷分類，再決定列入損益或其他綜合損益。'},{n:'第14章',t:'現金流量表',k:'營業、投資、籌資活動',plain:'損益表說明賺多少；現金流量表說明現金從哪裡來、用到哪裡。',rule:'營業＝主要營運；投資＝長期資產與投資；籌資＝借款、還款與股東資金。',ex:'購買設備付現＝投資活動現金流出。'},{n:'第15章',t:'財務報表分析',k:'水平、垂直、比率分析',plain:'分析不是只算比率，而是用數字判斷獲利、償債、效率與財務結構。',rule:'流動比率＝流動資產÷流動負債；負債比率＝負債÷資產。',ex:'流動資產200,000、流動負債100,000，流動比率＝2。'}];const Q=[{c:0,q:'下列何者屬於資產？',a:['應付帳款','現金','資本','銷貨收入'],x:1,e:'現金是企業控制的資源，屬於資產。'},{c:0,q:'會計等式何者正確？',a:['資產＝負債＋權益','資產＝收入＋費用','負債＝資產＋權益','權益＝資產＋負債'],x:0,e:'基本會計等式為資產＝負債＋權益。'},{c:1,q:'以現金支付租金，正確方向為何？',a:['借現金、貸租金費用','借租金費用、貸現金','借租金費用、貸應付帳款','借資本、貸現金'],x:1,e:'租金費用增加記借方；現金資產減少記貸方。'},{c:1,q:'下列哪一類科目增加通常記貸方？',a:['資產','費用','收入','現金'],x:2,e:'負債、權益、收入增加通常記貸方。'},{c:2,q:'預付一年保險費，經過一個月後調整應如何處理？',a:['增加預付保險費','認列一個月保險費並減少預付保險費','增加現金','增加收入'],x:1,e:'已耗用的部分成為本期費用，因此借保險費、貸預付保險費。'},{c:3,q:'永續盤存制下，銷售商品通常需要幾組分錄？',a:['一組','兩組','三組','不需分錄'],x:1,e:'一組認列收入，另一組認列銷貨成本並減少存貨。'},{c:4,q:'銀行直接扣手續費而公司尚未入帳，銀行調節後公司應？',a:['不處理','借銀行手續費、貸銀行存款','借銀行存款、貸收入','借應付帳款、貸現金'],x:1,e:'這是銀行已記、公司未記的項目，公司要補做分錄。'},{c:5,q:'實際沖銷確定無法收回的應收帳款，在備抵法下應？',a:['借備抵損失、貸應收帳款','借信用減損損失、貸現金','借應收帳款、貸備抵損失','借現金、貸應收帳款'],x:0,e:'備抵法實際沖銷時借記備抵損失，貸記應收帳款。'},{c:6,q:'期末存貨少算，其他條件不變，銷貨成本會？',a:['少算','多算','不變','無法判斷'],x:1,e:'可供銷售商品成本固定時，期末存貨少算會使銷貨成本多算。'},{c:7,q:'償還應付帳款時，應付帳款應記在哪一方？',a:['借方','貸方','不記錄','收入'],x:0,e:'負債減少記借方，因此清償應付帳款時借應付帳款、貸現金。'},{c:8,q:'權責基礎最重視的是？',a:['只在收現時認收入','只在付現時認費用','依交易發生及本期歸屬認列','所有交易等到年底才記'],x:2,e:'權責基礎重視交易發生與收入、費用的期間歸屬，而非只看現金收付。'},{c:9,q:'設備成本100,000、殘值10,000、耐用5年，直線法每年折舊？',a:['10,000','18,000','20,000','22,000'],x:1,e:'（100,000－10,000）÷5＝18,000。'},{c:10,q:'下列何者通常會使權益減少？',a:['收入','業主投入','費用','發行股份'],x:2,e:'費用會降低本期損益，進而降低權益。'},{c:11,q:'有效利息法下，利息費用通常以何者乘有效利率？',a:['面額','期初攤銷後成本','現金餘額','股本'],x:1,e:'有效利息法以期初攤銷後成本乘有效利率計算利息費用。'},{c:12,q:'投資會計處理前，第一步最重要的是？',a:['一律按成本','先判斷工具性質與分類','一律列其他綜合損益','一律列流動資產'],x:1,e:'先判斷是債務或權益工具及其分類，才能決定後續衡量。'},{c:13,q:'公司以現金購買機器設備，在現金流量表屬於？',a:['營業活動','投資活動','籌資活動','非現金活動'],x:1,e:'取得長期資產屬於投資活動現金流出。'},{c:14,q:'流動資產200,000、流動負債100,000，流動比率為？',a:['0.5','1','2','3'],x:2,e:'200,000÷100,000＝2。'}];let curQ=null,done=0,right=0,practiceChapterFilter=null,answered=false;function readJSON(k,d=[]){try{let v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:d}catch(e){return d}}function getScope(){return readJSON('examScope',[])}function go(id){document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));let p=document.getElementById(id);if(p)p.classList.add('on');document.querySelectorAll('.nav button').forEach(e=>e.classList.toggle('on',e.dataset.page===id));window.scrollTo(0,0);if(id==='wrong')renderWrong();if(id==='home')renderHome();if(id==='chapters')renderChapters()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));function renderHome(){let s=getScope();document.getElementById('scopeSummary').innerHTML=s.length?`本次已設定 <b>${s.length} 章</b>：${s.map(i=>C[i]?.n).filter(Boolean).join('、')}`:'尚未設定考試範圍。可先設定；若直接練習，會從目前全部題目抽題。';let last=Number(localStorage.getItem('lastChapter'));document.getElementById('resumeBox').innerHTML=Number.isInteger(last)&&C[last]?`<button class="primary" onclick="openLesson(${last})">繼續學習：${C[last].n}｜${C[last].t}</button>`:''}function renderChapters(){let s=getScope();document.getElementById('chapterList').innerHTML=C.map((c,i)=>`<button class="chapterBtn" onclick="openLesson(${i})"><span><b>${s.includes(i)?'★ ':''}${c.n}｜${c.t}</b><span class="muted">${c.k}</span></span><span class="arrow">›</span></button>`).join('')}function renderScope(){let saved=getScope();document.getElementById('scopeList').innerHTML=C.map((c,i)=>`<label class="scopeRow"><input class="scopeBox" type="checkbox" value="${i}" ${saved.includes(i)?'checked':''}><span><b>${c.n}｜${c.t}</b><br><span class="muted">${c.k}</span></span></label>`).join('')}function openLesson(i){let c=C[i];if(!c)return;localStorage.setItem('lastChapter',String(i));let prev=i>0?`<button class="secondary" onclick="openLesson(${i-1})">← ${C[i-1].n}</button>`:'<span></span>';let next=i<C.length-1?`<button class="secondary" onclick="openLesson(${i+1})">${C[i+1].n} →</button>`:'<span></span>';document.getElementById('lessonBody').innerHTML=`<div class="card lesson"><span class="tag">${c.n}</span><h2 style="margin-top:9px">${c.t}</h2><p class="muted">考前重點：${c.k}</p><h3>① 先用白話理解</h3><div class="box">${c.plain}</div><h3>② 必記規則／公式</h3><div class="formula">${c.rule}</div><h3>③ 看一個例子</h3><div class="journal">${c.ex}</div><h3>④ 解題順序</h3><div class="box">先抓題目關鍵字 → 找會計科目 → 判斷五大要素 → 判斷增加或減少 → 決定借貸；計算題先列公式再代數字。</div><button class="primary" onclick="practiceChapter(${i})">練習這一章</button><div class="chapterNav">${prev}${next}</div></div>`;go('lesson')}function setAll(v){document.querySelectorAll('.scopeBox').forEach(e=>e.checked=v)}function saveScope(){let v=[...document.querySelectorAll('.scopeBox:checked')].map(e=>Number(e.value));localStorage.setItem('examScope',JSON.stringify(v));document.getElementById('saveStatus').innerHTML=`<div class="feedback">✓ 已儲存 ${v.length} 章。設定已保存在這台裝置。</div>`;renderHome();renderChapters()}function startPractice(){practiceChapterFilter=null;done=0;right=0;updateStats();go('practice');nextQuestion()}function practiceChapter(i){practiceChapterFilter=i;done=0;right=0;updateStats();go('practice');nextQuestion()}function poolForPractice(){if(Number.isInteger(practiceChapterFilter))return Q.filter(q=>q.c===practiceChapterFilter);let s=getScope();return s.length?Q.filter(q=>s.includes(q.c)):Q}function nextQuestion(){let pool=poolForPractice();answered=false;if(!pool.length){document.getElementById('quiz').innerHTML='<div class="feedback"><b>這個範圍目前沒有可作答題目。</b><br>請回到「範圍」加入其他章節，或從章節頁選擇有題目的章節。</div>';document.getElementById('nextBtn').style.display='none';return}document.getElementById('nextBtn').style.display='block';let choices=pool.length>1?pool.filter(q=>q!==curQ):pool;curQ=choices[Math.floor(Math.random()*choices.length)];document.getElementById('quiz').innerHTML=`<div class="tag">${C[curQ.c].n}｜${C[curQ.c].t}</div><h3>${curQ.q}</h3>${curQ.a.map((x,i)=>`<button class="answer" onclick="answer(${i},this)">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}<div id="fb"></div>`}function answer(i,el){if(answered||!curQ)return;answered=true;done++;let ok=i===curQ.x;if(ok)right++;let buttons=[...document.querySelectorAll('#quiz .answer')];buttons[curQ.x]?.classList.add('correct');if(!ok){el.classList.add('wrong');let w=readJSON('wrongQuestions',[]);let key=curQ.q;w=w.filter(x=>x.q!==key);w.unshift({q:curQ.q,e:curQ.e,c:curQ.c,t:Date.now()});localStorage.setItem('wrongQuestions',JSON.stringify(w.slice(0,100)))}document.getElementById('fb').innerHTML=`<div class="feedback"><b>${ok?'✓ 答對':'✗ 答錯'}</b><br>${curQ.e}</div>`;updateStats()}function updateStats(){document.getElementById('doneN').textContent=done;document.getElementById('rightN').textContent=right;document.getElementById('rateN').textContent=done?Math.round(right/done*100)+'%':'—'}function renderWrong(){let w=readJSON('wrongQuestions',[]);document.getElementById('wrongList').innerHTML=w.length?w.map((x,idx)=>`<div class="box"><span class="tag">${C[x.c]?.n||'章節'}</span><br><b>${x.q}</b><br><span class="muted">解析：${x.e}</span><br><button class="secondary" onclick="retryWrong(${idx})">重做這題</button></div>`).join(''):'<div class="empty">目前沒有錯題。<br>練習答錯後會自動收進來。</div>'}function retryWrong(idx){let w=readJSON('wrongQuestions',[]),item=w[idx];if(!item)return;let q=Q.find(z=>z.q===item.q);if(!q)return;practiceChapterFilter=q.c;go('practice');curQ=q;answered=false;document.getElementById('nextBtn').style.display='block';document.getElementById('quiz').innerHTML=`<div class="tag">錯題重做｜${C[q.c].n}</div><h3>${q.q}</h3>${q.a.map((x,i)=>`<button class="answer" onclick="answer(${i},this)">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}<div id="fb"></div>`}function clearWrong(){if(!confirm('確定清除全部錯題紀錄？'))return;localStorage.removeItem('wrongQuestions');renderWrong()}renderScope();renderChapters();renderHome();updateStats();</script></body></html>
