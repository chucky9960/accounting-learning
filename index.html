<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b5c"><title>會計學習</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#182734;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;font-size:18px}.top{background:#173b5c;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 20px}.top h1{margin:0;font-size:30px}.top p{margin:5px 0 0;color:#d8e5ef}.wrap{max-width:1080px;margin:auto;padding:16px 16px 105px}.card{background:#fff;border:1px solid #dce5ec;border-radius:18px;padding:19px;margin-bottom:15px;box-shadow:0 2px 8px #173b5c0c}h2{margin:0 0 12px;font-size:24px}h3{font-size:20px;margin:18px 0 8px}.muted{color:#687a88;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big,.chapterBtn,.primary,.answer{border:0;cursor:pointer}.big{border-radius:15px;padding:17px;text-align:left;background:#eaf2f8;color:#173b5c;font-size:17px;font-weight:800}.chapterBtn{width:100%;display:flex;align-items:center;justify-content:space-between;background:#fff;text-align:left;padding:17px 4px;border-bottom:1px solid #e8eef2;font-size:18px;color:#182734}.chapterBtn b{display:block}.arrow{font-size:25px;color:#668094}.tag{font-size:13px;background:#edf4f8;color:#48687d;padding:4px 8px;border-radius:20px}.part{font-size:14px;font-weight:800;color:#6b7e8b;margin:20px 0 4px}.lesson{line-height:1.75}.box{background:#f5f8fa;border-radius:14px;padding:15px;margin:12px 0}.formula{background:#fff8e8;border-left:5px solid #e6ae3a;padding:14px;border-radius:10px;margin:12px 0}.journal{background:#eef5f0;border-left:5px solid #5b9270;padding:14px;border-radius:10px;line-height:1.8}.primary{width:100%;background:#173b5c;color:#fff;border-radius:14px;padding:15px;font-size:18px;font-weight:800;margin-top:12px}.secondary{border:1px solid #c8d5de;background:#fff;border-radius:12px;padding:10px 13px;font-size:16px;margin:3px;cursor:pointer}.scopeRow{display:flex;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid #e8eef2}.scopeRow input{width:25px;height:25px}.answer{display:block;width:100%;text-align:left;padding:14px;margin:9px 0;border-radius:12px;background:#f4f7f9;border:1px solid #d8e2e9;font-size:17px;color:#172733}.answer.correct{background:#e8f5ec;border-color:#80b690}.answer.wrong{background:#fff0ef;border-color:#d99b96}.feedback{padding:13px;border-radius:12px;margin-top:10px;background:#f4f7f9}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dce4ea;display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom));justify-content:space-around}.nav button{width:20%;border:0;background:transparent;padding:7px 1px;color:#435765;font-weight:800;font-size:12px}.nav span{display:block;font-size:23px}.nav .on{color:#173b5c;background:#eaf2f8;border-radius:14px}.page{display:none}.page.on{display:block}.back{border:0;background:none;color:#275a7b;font-size:17px;font-weight:700;padding:3px 0 14px;cursor:pointer}.stats{display:flex;gap:10px}.stat{flex:1;background:#f3f7fa;border-radius:13px;padding:13px;text-align:center}.stat b{display:block;font-size:25px;color:#173b5c}.empty{text-align:center;padding:30px;color:#6c7d89}@media(min-width:800px){.wrap{padding:26px}.desktop{display:grid;grid-template-columns:240px 1fr;gap:22px}.nav{position:sticky;top:20px;display:block;border:0;border-radius:18px;padding:8px;height:max-content}.nav button{width:100%;text-align:left;font-size:16px;padding:13px}.nav span{display:inline-block;width:32px;font-size:19px}.grid{grid-template-columns:repeat(4,1fr)}.content{min-width:0}}</style></head><body><header class="top"><h1>會計學習</h1><p>考前可直接使用 · 初學者模式</p></header><div class="wrap desktop"><nav class="nav"><button class="on" data-page="home"><span>⌂</span>首頁</button><button data-page="chapters"><span>▤</span>章節</button><button data-page="scope"><span>✓</span>範圍</button><button data-page="practice"><span>✎</span>練習</button><button data-page="wrong"><span>!</span>錯題</button></nav><main class="content"><section id="home" class="page on"><div class="card"><h2>考前學習</h2><p class="muted">先設定考試範圍，再從章節學習。每章都可點入，並有重點、白話理解、借貸判斷與例題。</p><div class="grid"><button class="big" onclick="go('scope')">✓ 設定考試範圍</button><button class="big" onclick="go('chapters')">📖 章節學習</button><button class="big" onclick="startPractice()">✎ 開始練習</button><button class="big" onclick="go('wrong')">! 查看錯題</button></div></div><div class="card lesson"><h2>借貸最重要規則</h2><div class="formula"><b>資產、費用增加 → 借方</b><br><b>負債、權益、收入增加 → 貸方</b></div><p>不要背「借＝增加、貸＝減少」。一定先判斷科目屬於五大要素，再決定方向。</p></div></section><section id="chapters" class="page"><div class="card"><h2>章節學習</h2><p class="muted">直接點任何一章進入。考前可只讀你勾選的範圍。</p><div id="chapterList"></div></div></section><section id="lesson" class="page"><button class="back" onclick="go('chapters')">← 回章節</button><div id="lessonBody"></div></section><section id="scope" class="page"><div class="card"><h2>本次考試範圍</h2><p class="muted">可跳章勾選。儲存後，「範圍練習」只從勾選章節抽題。</p><button class="secondary" onclick="setAll(true)">全部勾選</button><button class="secondary" onclick="setAll(false)">全部清除</button><div id="scopeList"></div><button class="primary" onclick="saveScope()">儲存考試範圍</button><div id="saveStatus"></div></div></section><section id="practice" class="page"><div class="card"><h2>題目練習</h2><div class="stats"><div class="stat"><b id="doneN">0</b>本次作答</div><div class="stat"><b id="rightN">0</b>答對</div></div><div id="quiz" style="margin-top:18px"></div><button class="primary" onclick="nextQuestion()">下一題</button></div></section><section id="wrong" class="page"><div class="card"><h2>我的錯題</h2><div id="wrongList"></div></div></section></main></div><script>const C=[{n:'第1章',t:'會計基本概念',k:'五大要素、會計等式、交易分析',plain:'會計是在回答：公司有什麼、欠什麼、老闆真正擁有多少，以及這段期間賺了多少。',rule:'資產＝負債＋權益。每一筆交易都必須維持等式平衡。',ex:'老闆投入現金100,000：現金（資產）增加，同時資本（權益）增加。'},{n:'第2章',t:'借貸法則與會計記錄',k:'借貸、分錄、過帳、試算',plain:'借與貸只是左右位置，不是日常語言的借錢與貸款。',rule:'資產/費用增加記借方；負債/權益/收入增加記貸方。',ex:'現金支付租金10,000：借：租金費用10,000；貸：現金10,000。'},{n:'第3章',t:'調整與編表',k:'應計、遞延、折舊、調整分錄',plain:'月底不能只看有沒有收付現金，要把真正屬於本期的收入與費用放回本期。',rule:'先問「這筆金額有多少已經屬於本期？」再調整資產/負債與收入/費用。',ex:'預付一年保險12,000，一個月到期：借保險費1,000；貸預付保險費1,000。'},{n:'第4章',t:'買賣業會計',k:'進貨、銷貨、銷貨成本、折扣退回',plain:'買賣業多了商品存貨，因此賣東西時除了認列收入，也要把賣掉商品的成本轉出去。',rule:'永續盤存制銷貨通常有兩筆分錄：認列銷貨收入＋認列銷貨成本。',ex:'成本600商品售價1,000收現：借現金1,000貸銷貨收入1,000；借銷貨成本600貸存貨600。'},{n:'第5章',t:'現金與銀行存款',k:'現金控制、銀行存款調節',plain:'公司帳上的銀行餘額與銀行對帳單可能因時間差不同，要找出未兌現支票、在途存款等差異。',rule:'銀行調節後，真正需要公司做分錄的是「公司帳上尚未記錄」的項目。',ex:'銀行扣手續費100公司未記：借銀行手續費100；貸銀行存款100。'},{n:'第6章',t:'應收款項',k:'應收帳款、備抵損失、票據',plain:'賒銷代表先認列收入，之後才收錢；同時必須估計可能收不回的金額。',rule:'備抵法：認列信用減損時借損失、貸備抵；實際沖銷時借備抵、貸應收帳款。',ex:'估計信用損失2,000：借預期信用減損損失2,000；貸備抵損失2,000。'},{n:'第7章',t:'存貨',k:'成本流動、FIFO、加權平均、淨變現價值',plain:'存貨計價會影響期末存貨，也會反方向影響銷貨成本與本期淨利。',rule:'期初存貨＋本期進貨＝可供銷售商品成本＝銷貨成本＋期末存貨。',ex:'期末存貨少算1,000 → 銷貨成本多算1,000 → 淨利少算1,000。'},{n:'第8章',t:'流動負債及或有事項',k:'應付、短期負債、估計負債',plain:'已經發生且公司有現時義務，就要判斷是否應認列負債；不確定事項則看發生可能性與能否可靠估計。',rule:'負債增加通常記貸方；清償負債時借負債、貸現金。',ex:'賒購用品5,000：借用品5,000；貸應付帳款5,000。'},{n:'第9章',t:'會計原則',k:'認列、衡量、表達與揭露',plain:'遇到題目不是只背分錄，要知道財報資訊為何這樣認列與衡量。',rule:'先辨認交易實質，再判斷何時認列、用多少金額衡量、放在哪張報表。',ex:'考題常以「何時認列收入／費用」測試權責基礎。'},{n:'第10章',t:'固定資產與無形資產',k:'取得成本、折舊、處分、無形資產',plain:'長期使用的資產不是買來當期全部變費用，而是依受益期間分攤。',rule:'直線法折舊＝(成本－殘值)÷耐用年限。',ex:'設備100,000、殘值10,000、5年：每年折舊18,000。'},{n:'第11章',t:'股東權益',k:'股本、資本公積、保留盈餘、股利',plain:'權益是資產扣掉負債後屬於業主/股東的剩餘權益。',rule:'收入增加最終增加保留盈餘；費用與股利會降低權益。',ex:'宣告現金股利會增加應付股利並減少保留盈餘。'},{n:'第12章',t:'長期負債',k:'公司債、溢折價、利息',plain:'借款時間超過一年時，除了本金還要處理利息及可能的溢折價攤銷。',rule:'有效利息法的利息費用＝期初攤銷後成本×有效利率。',ex:'票面利率與市場利率不同時，發行價格通常不等於面額。'},{n:'第13章',t:'投資',k:'債券投資、權益投資、衡量',plain:'投資的會計處理取決於投資工具性質與分類，不是所有股票債券都用同一方法。',rule:'先辨認債務工具或權益工具，再判斷衡量分類及未實現損益去向。',ex:'題目看到公允價值變動時，先判斷分類，再決定損益或其他綜合損益。'},{n:'第14章',t:'現金流量表',k:'營業、投資、籌資活動',plain:'損益表說賺多少，現金流量表說現金到底從哪裡來、花到哪裡。',rule:'營業＝主要營運；投資＝長期資產/投資；籌資＝借款、還款、股東資金。',ex:'購買設備付現＝投資活動現金流出。'},{n:'第15章',t:'財務報表分析',k:'水平、垂直、比率分析',plain:'分析不是只算比率，而是用數字判斷獲利、償債、經營效率與財務結構。',rule:'流動比率＝流動資產÷流動負債；負債比率＝負債÷資產。',ex:'流動資產200,000、流動負債100,000，流動比率＝2。'}];const Q=[{c:0,q:'下列何者屬於資產？',a:['應付帳款','現金','資本','銷貨收入'],x:1,e:'現金是企業控制、可帶來經濟效益的資源，屬於資產。'},{c:1,q:'以現金支付租金，正確方向為何？',a:['借現金、貸租金費用','借租金費用、貸現金','借租金費用、貸應付帳款','借資本、貸現金'],x:1,e:'租金費用增加記借方；現金資產減少記貸方。'},{c:2,q:'預付一年保險費，經過一個月後調整分錄應如何處理？',a:['增加預付保險費','認列一個月保險費並減少預付保險費','增加現金','增加收入'],x:1,e:'已耗用的部分已成為本期費用，因此借保險費、貸預付保險費。'},{c:3,q:'永續盤存制下，銷售商品通常需要幾組分錄？',a:['一組','兩組','三組','不需分錄'],x:1,e:'一組認列收入與收款/應收款，另一組認列銷貨成本並減少存貨。'},{c:4,q:'銀行直接扣手續費而公司尚未入帳，銀行調節後公司應？',a:['不處理','借銀行手續費、貸銀行存款','借銀行存款、貸收入','借應付帳款、貸現金'],x:1,e:'這是銀行已記、公司未記的項目，公司需要補做分錄。'},{c:6,q:'期末存貨少算，其他條件不變，銷貨成本會？',a:['少算','多算','不變','無法判斷'],x:1,e:'可供銷售成本固定時，期末存貨少算會使銷貨成本多算。'},{c:9,q:'設備成本100,000、殘值10,000、耐用5年，直線法每年折舊？',a:['10,000','18,000','20,000','22,000'],x:1,e:'(100,000－10,000)÷5＝18,000。'},{c:13,q:'公司以現金購買機器設備，在現金流量表屬於？',a:['營業活動','投資活動','籌資活動','非現金活動'],x:1,e:'取得長期資產屬於投資活動現金流出。'},{c:14,q:'流動資產200,000、流動負債100,000，流動比率為？',a:['0.5','1','2','3'],x:2,e:'200,000÷100,000＝2。'}];let curQ=null,done=0,right=0;function go(id){document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));let p=document.getElementById(id);if(p)p.classList.add('on');document.querySelectorAll('.nav button').forEach(e=>e.classList.toggle('on',e.dataset.page===id));window.scrollTo(0,0);if(id==='wrong')renderWrong()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));function render(){let a='',b='';let saved=getScope();C.forEach((c,i)=>{a+=`<button class="chapterBtn" onclick="openLesson(${i})"><span><b>${c.n}｜${c.t}</b><span class="muted">${c.k}</span></span><span class="arrow">›</span></button>`;b+=`<label class="scopeRow"><input class="scopeBox" type="checkbox" value="${i}" ${saved.includes(i)?'checked':''}><span><b>${c.n}｜${c.t}</b><br><span class="muted">${c.k}</span></span></label>`});document.getElementById('chapterList').innerHTML=a;document.getElementById('scopeList').innerHTML=b}function openLesson(i){let c=C[i];localStorage.setItem('lastChapter',i);document.getElementById('lessonBody').innerHTML=`<div class="card lesson"><span class="tag">${c.n}</span><h2 style="margin-top:9px">${c.t}</h2><p class="muted">考試重點：${c.k}</p><h3>① 先用白話理解</h3><div class="box">${c.plain}</div><h3>② 必記規則</h3><div class="formula">${c.rule}</div><h3>③ 看一個例子</h3><div class="journal">${c.ex}</div><h3>④ 考題看到什麼？</h3><p>看到題目關鍵字時，先判斷涉及的會計科目與五大要素，再決定借貸方向；計算題先列公式，不要直接猜答案。</p><button class="primary" onclick="practiceChapter(${i})">練習這一章</button></div>`;go('lesson')}function getScope(){try{return JSON.parse(localStorage.getItem('examScope')||'[]')}catch(e){return[]}}function setAll(v){document.querySelectorAll('.scopeBox').forEach(e=>e.checked=v)}function saveScope(){let v=[...document.querySelectorAll('.scopeBox:checked')].map(e=>+e.value);localStorage.setItem('examScope',JSON.stringify(v));document.getElementById('saveStatus').innerHTML=`<div class="feedback">✓ 已儲存 ${v.length} 章。之後「開始練習」會優先使用這個範圍。</div>`}function startPractice(){go('practice');nextQuestion()}function practiceChapter(i){go('practice');nextQuestion(i)}function nextQuestion(ch){let pool=Q;if(Number.isInteger(ch))pool=Q.filter(q=>q.c===ch);else{let s=getScope();if(s.length)pool=Q.filter(q=>s.includes(q.c));}if(!pool.length){document.getElementById('quiz').innerHTML='<div class="feedback">這個範圍目前還沒有題目，請先到其他章練習。</div>';return}curQ=pool[Math.floor(Math.random()*pool.length)];document.getElementById('quiz').innerHTML=`<div class="tag">${C[curQ.c].n}</div><h3>${curQ.q}</h3>${curQ.a.map((x,i)=>`<button class="answer" onclick="answer(${i},this)">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}<div id="fb"></div>`}function answer(i,el){if(document.getElementById('fb').innerHTML)return;done++;let ok=i===curQ.x;if(ok)right++;document.querySelectorAll('.answer')[curQ.x].classList.add('correct');if(!ok){el.classList.add('wrong');let w=[];try{w=JSON.parse(localStorage.getItem('wrongQuestions')||'[]')}catch(e){}w.unshift({q:curQ.q,e:curQ.e,c:C[curQ.c].n,t:Date.now()});localStorage.setItem('wrongQuestions',JSON.stringify(w.slice(0,50)))}document.getElementById('fb').innerHTML=`<div class="feedback"><b>${ok?'✓ 答對':'✗ 答錯'}</b><br>${curQ.e}</div>`;document.getElementById('doneN').textContent=done;document.getElementById('rightN').textContent=right}function renderWrong(){let w=[];try{w=JSON.parse(localStorage.getItem('wrongQuestions')||'[]')}catch(e){}document.getElementById('wrongList').innerHTML=w.length?w.map(x=>`<div class="box"><span class="tag">${x.c}</span><br><b>${x.q}</b><br><span class="muted">${x.e}</span></div>`).join(''):'<div class="empty">目前沒有錯題。<br>練習答錯後會自動收進來。</div>'}render();</script></body></html>
