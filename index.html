<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b5c"><title>會計學習｜正式考前版</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#182734;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.top{background:#173b5c;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px}.top h1{margin:0;font-size:27px}.top p{margin:4px 0 0;color:#d8e5ef}.wrap{max-width:1080px;margin:auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}.card{background:#fff;border:1px solid #dce5ec;border-radius:17px;padding:17px;margin-bottom:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}h2{margin:0 0 10px}.muted{color:#687a88}.big,.primary,.secondary,.back,.answer,.chapterBtn{cursor:pointer}.big{border:0;border-radius:14px;padding:16px;text-align:left;background:#eaf2f8;color:#173b5c;font-weight:800}.primary{width:100%;border:0;background:#173b5c;color:#fff;border-radius:13px;padding:14px;font-size:17px;font-weight:800;margin-top:10px}.secondary,.back{border:1px solid #c8d5de;background:#fff;border-radius:11px;padding:9px 12px;margin:3px}.back{background:#eaf2f8;color:#275a7b;font-weight:800;margin-bottom:11px}.chapterBtn{width:100%;display:flex;justify-content:space-between;border:0;border-bottom:1px solid #e8eef2;background:#fff;text-align:left;padding:15px 3px;font-size:17px}.tag{font-size:13px;background:#edf4f8;color:#48687d;padding:4px 8px;border-radius:20px}.notice,.formula{background:#fff8e8;border-radius:12px;padding:11px;margin-bottom:12px}.formula{border-left:5px solid #e6ae3a}.box{background:#f5f8fa;border-radius:13px;padding:14px;margin:11px 0}.lesson{line-height:1.72}.scopeRow{display:flex;gap:11px;align-items:center;padding:12px 2px;border-bottom:1px solid #e8eef2}.scopeRow input{width:24px;height:24px}.answer{display:block;width:100%;text-align:left;padding:13px;margin:8px 0;border-radius:12px;background:#f4f7f9;border:1px solid #d8e2e9;font-size:16px}.answer.correct{background:#e8f5ec;border-color:#80b690}.answer.wrong{background:#fff0ef;border-color:#d99b96}.feedback{padding:12px;border-radius:12px;margin-top:10px;background:#f4f7f9}.stats,.bankbar{display:flex;gap:7px}.stat,.bankstat{flex:1;background:#eef4f8;border-radius:12px;padding:10px 4px;text-align:center;font-size:13px}.stat b,.bankstat b{display:block;font-size:22px;color:#173b5c}.progress{font-size:14px;font-weight:800;color:#49677b;margin:11px 0}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dce4ea;display:flex;padding:6px 3px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}.nav button{width:20%;border:0;background:transparent;padding:6px;color:#435765;font-weight:800;font-size:11px}.nav span{display:block;font-size:21px}.nav .on{color:#173b5c;background:#eaf2f8;border-radius:13px}.page{display:none}.page.on{display:block}.empty{text-align:center;padding:26px;color:#6c7d89}.chapterNav{display:grid;grid-template-columns:1fr 1fr;gap:7px}@media(min-width:800px){.wrap{padding:24px}.desktop{display:grid;grid-template-columns:230px 1fr;gap:20px}.nav{position:sticky;top:18px;display:block;border:0;border-radius:17px;padding:8px;height:max-content}.nav button{width:100%;text-align:left;font-size:15px;padding:12px}.nav span{display:inline-block;width:30px}.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr}.top h1{font-size:24px}.card{padding:14px}.wrap{padding:11px 11px calc(91px + env(safe-area-inset-bottom))}.bankstat b{font-size:18px}}</style></head><body><header class="top"><h1>會計學習</h1><p>正式考前版 · 第十三版教材架構</p></header><div class="wrap desktop"><nav class="nav"><button data-page="home"><span>⌂</span>首頁</button><button data-page="chapters"><span>▤</span>章節</button><button data-page="scope"><span>✓</span>範圍</button><button data-page="practice"><span>✎</span>練習</button><button data-page="wrong"><span>!</span>錯題</button></nav><main><section id="home" class="page"><div class="card"><h2>考前學習</h2><div id="bankStats" class="bankbar"></div><div id="scopeSummary" class="notice"></div><div class="grid"><button class="big" onclick="go('scope')">✓ 設定考試範圍</button><button class="big" onclick="go('chapters')">📖 章節學習</button><button class="big" onclick="startMode('essence100')">★ 考前精髓100題</button><button class="big" onclick="startMode('essence300')">★★ 核心精髓300題</button><button class="big" onclick="startMode('essence500')">★★★ 完整精髓500題</button><button class="big" onclick="startMode('weak')">🎯 我的弱點題</button><button class="big" onclick="startMode('quick')">⚡ 快速10題</button><button class="big" onclick="startMode('standard')">✎ 標準30題</button><button class="big" onclick="startMode('scope')">▤ 範圍完整練習</button><button class="big" onclick="go('wrong')">! 查看錯題</button></div><div id="resumeBox"></div></div><div class="card lesson"><h2>借貸核心規則</h2><div class="formula"><b>資產、費用增加 → 借方</b><br><b>負債、權益、收入增加 → 貸方</b></div></div></section><section id="chapters" class="page"><button class="back" onclick="goBack()">← 返回上一步</button><div class="card"><h2>章節學習</h2><div id="chapterList"></div></div></section><section id="lesson" class="page"><button class="back" onclick="goBack()">← 返回上一步</button><div id="lessonBody"></div></section><section id="scope" class="page"><button class="back" onclick="goBack()">← 返回上一步</button><div class="card"><h2>本次考試範圍</h2><button class="secondary" onclick="setAll(true)">全部勾選</button><button class="secondary" onclick="setAll(false)">全部清除</button><div id="scopeList"></div><button class="primary" onclick="saveScope()">儲存考試範圍</button><div id="saveStatus"></div></div></section><section id="practice" class="page"><button class="back" onclick="goBack()">← 返回上一步</button><div class="card"><h2 id="practiceTitle">題目練習</h2><div class="stats"><div class="stat"><b id="doneN">0</b>已作答</div><div class="stat"><b id="rightN">0</b>答對</div><div class="stat"><b id="rateN">—</b>正確率</div></div><div id="progress" class="progress"></div><div id="quiz"></div><button id="nextBtn" class="primary" onclick="nextQuestion()">下一題</button></div></section><section id="wrong" class="page"><button class="back" onclick="goBack()">← 返回上一步</button><div class="card"><h2>我的錯題</h2><button class="secondary" onclick="clearWrong()">清除全部錯題</button><div id="wrongList"></div></div></section></main></div><script src="question-bank.js"></script><script src="question-bank-1-6-1000.js"></script><script src="question-bank-1-6-scale.js"></script><script src="question-bank-1-6-deep.js"></script><script src="question-bank-1-6-exam.js"></script><script src="question-bank-essence-tiers.js"></script><script>
const C=[['會計基本概念','會計目的、五大要素、會計等式、交易分析'],['借貸法則與會計記錄','借貸、分錄、過帳、試算'],['調整與編表','應計、遞延、折舊、調整分錄'],['買賣業會計','進貨、銷貨、銷貨成本、折扣退回'],['現金與銀行存款','現金控制、銀行存款調節'],['應收款項','應收帳款、備抵損失、票據'],['存貨','成本流動、FIFO、加權平均、淨變現價值'],['流動負債及或有事項','應付、短期負債、估計負債'],['會計原則','認列、衡量、表達與揭露'],['固定資產與無形資產','取得成本、折舊、處分、無形資產'],['股東權益','股本、資本公積、保留盈餘、股利'],['長期負債','公司債、溢折價、利息'],['投資','債券投資、權益投資、衡量'],['現金流量表','營業、投資、籌資三類'],['財務報表分析','水平、垂直、比率分析']];
const lessons=[['會計用來辨認、衡量、記錄與報導企業經濟活動。','資產＝負債＋權益。收入增加權益，費用降低權益。'],['借貸是記錄位置，不是日常語言的借錢。','資產、費用增加記借方；負債、權益、收入增加記貸方。'],['期末把真正屬於本期的收入與費用放回本期。','先判斷已賺得或已耗用多少，再調整。'],['買賣業多了商品存貨與銷貨成本。','永續盤存制銷貨通常同時記收入與銷貨成本。'],['公司帳與銀行帳可能有時間差。','逐項核對未兌現支票、在途存款及銀行已記公司未記項目。'],['賒銷形成收款權利，也要考慮信用損失。','分清應收帳款、票據及備抵。'],['存貨影響銷貨成本與淨利。','期初存貨＋進貨＝銷貨成本＋期末存貨。'],['負債代表企業現時義務。','判斷義務、清償與估計。'],['會計原則協助判斷認列、衡量與表達。','先看交易實質。'],['長期使用資產成本通常跨期分攤。','直線法＝（成本－殘值）÷耐用年限。'],['權益是資產扣除負債後的剩餘。','分清投入、盈餘與分配。'],['長期負債常涉及利息與溢折價。','有效利息法重視攤銷後成本。'],['投資處理取決於工具性質與分類。','先辨認債務或權益工具。'],['現金流量表說明現金來源與用途。','營業、投資、籌資三類。'],['財報分析重點是解讀。','搭配期間、同業與結構比較。']];
const Q=window.QBANK||[];let currentPage='home',stack=[],lessonIndex=null,pool=[],pos=0,curQ=null,answered=false,done=0,right=0,mode='scope';
function read(k,d=[]){try{let v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:d}catch{return d}}function scope(){return read('examScope',[])}function mastery(){try{return JSON.parse(localStorage.getItem('mastery')||'{}')}catch{return {}}}
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.page===id));currentPage=id;if(id==='home')renderHome();if(id==='chapters')renderChapters();if(id==='wrong')renderWrong()}
function go(id){if(currentPage!==id)stack.push({page:currentPage,chapter:lessonIndex});show(id)}function goBack(){let s=stack.pop();if(!s)return show('home');if(s.page==='lesson'&&s.chapter!=null){lessonIndex=s.chapter;show('lesson');renderLesson()}else show(s.page)}
function renderHome(){let sc=scope(),tier=window.QBANK_ESSENCE?.counts||{};bankStats.innerHTML=`<div class="bankstat"><b>${Q.length.toLocaleString()}</b>總題數</div><div class="bankstat"><b>${tier[100]||0}/${tier[300]||0}/${tier[500]||0}</b>精髓分級</div><div class="bankstat"><b>${new Set(Q.map(q=>q.motherId||q.id)).size.toLocaleString()}</b>母題/考點</div>`;scopeSummary.textContent=sc.length?`本次範圍：${sc.map(i=>'第'+(i+1)+'章').join('、')}`:'尚未設定範圍，練習預設使用全部章節。';let last=Number(localStorage.getItem('lastChapter'));resumeBox.innerHTML=Number.isInteger(last)&&C[last]?`<button class="primary" onclick="openLesson(${last})">繼續上次：第${last+1}章 ${C[last][0]}</button>`:''}
function renderChapters(){let sc=scope();chapterList.innerHTML=C.map((c,i)=>`<button class="chapterBtn" onclick="openLesson(${i})"><span>${sc.includes(i)?'★ ':''}第${i+1}章 ${c[0]}<br><small>${c[1]}</small></span><span><b>${Q.filter(q=>q.c===i).length.toLocaleString()}</b> 題 ›</span></button>`).join('')}
function openLesson(i){if(currentPage!=='lesson')stack.push({page:currentPage,chapter:lessonIndex});lessonIndex=i;localStorage.setItem('lastChapter',i);show('lesson');renderLesson()}
function renderLesson(){let i=lessonIndex,qs=Q.filter(q=>q.c===i),ess=qs.filter(q=>q.essence).length;lessonBody.innerHTML=`<div class="card lesson"><span class="tag">第${i+1}章</span><h2>${C[i][0]}</h2><p>${lessons[i][0]}</p><div class="formula"><b>核心：</b>${lessons[i][1]}</div><div class="box">本章題庫 <b>${qs.length.toLocaleString()}</b> 題｜精髓 <b>${ess.toLocaleString()}</b> 題</div><button class="primary" onclick="startChapter(${i},false)">完整練習本章</button><button class="secondary" onclick="startChapter(${i},true)">只練本章精髓題</button><div class="chapterNav">${i?`<button class="secondary" onclick="openLesson(${i-1})">← 上一章</button>`:'<span></span>'}${i<14?`<button class="secondary" onclick="openLesson(${i+1})">下一章 →</button>`:''}</div></div>`}
function renderScope(){let sc=scope();scopeList.innerHTML=C.map((c,i)=>`<label class="scopeRow"><input type="checkbox" value="${i}" ${sc.includes(i)?'checked':''}><span><b>第${i+1}章 ${c[0]}</b><br><small>${Q.filter(q=>q.c===i).length.toLocaleString()} 題</small></span></label>`).join('')}
function setAll(v){document.querySelectorAll('#scopeList input').forEach(x=>x.checked=v)}function saveScope(){let v=[...document.querySelectorAll('#scopeList input:checked')].map(x=>+x.value);localStorage.setItem('examScope',JSON.stringify(v));saveStatus.innerHTML='<div class="feedback">已儲存。</div>';renderHome()}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startMode(m){mode=m;let sc=scope(),base=sc.length?Q.filter(q=>sc.includes(q.c)):Q;if(/^essence/.test(m)){let n=+m.replace('essence',''),ids=new Set((window.QBANK_ESSENCE?.[n]||[]));base=base.filter(q=>ids.has(q.id));}if(m==='weak'){let ms=mastery(),keys=Object.keys(ms).filter(k=>ms[k].wrong>ms[k].right||ms[k].streak<2);base=keys.length?base.filter(q=>keys.includes(q.motherId||q.id)):[];}pool=shuffle(base);if(m==='quick')pool=pool.slice(0,10);if(m==='standard')pool=pool.slice(0,30);practiceTitle.textContent=m==='essence100'?'考前精髓100題':m==='essence300'?'核心精髓300題':m==='essence500'?'完整精髓500題':m==='weak'?'我的弱點題':m==='quick'?'快速10題':m==='standard'?'標準30題':'範圍完整練習';begin()}
function startChapter(c,ess){mode='chapter';pool=shuffle(Q.filter(q=>q.c===c&&(!ess||q.essence)));practiceTitle.textContent=`第${c+1}章${ess?'精髓':'完整'}練習`;begin()}
function begin(){stack.push({page:currentPage,chapter:lessonIndex});show('practice');pos=0;done=0;right=0;renderStats();renderQ()}
function renderQ(){answered=false;if(!pool.length||pos>=pool.length){quiz.innerHTML=`<div class="empty"><h3>${!pool.length&&mode==='weak'?'目前尚無足夠弱點紀錄':'本輪完成'}</h3><p>${done?`作答 ${done} 題｜答對 ${right} 題｜正確率 ${Math.round(right/done*100)}%`:'先完成一些練習，系統會依母題答題紀錄建立弱點。'}</p></div>`;progress.textContent='';nextBtn.style.display='none';return}curQ=pool[pos];progress.textContent=`第 ${pos+1} / ${pool.length.toLocaleString()} 題｜第${curQ.c+1}章｜${curQ.topic}｜${curQ.type}${curQ.essenceTier?'｜★精髓'+curQ.essenceTier:''}`;quiz.innerHTML=`<h3>${curQ.q}</h3><div>${curQ.a.map((x,i)=>`<button class="answer" onclick="answer(${i},this)">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}</div><div id="feedback"></div>`;nextBtn.style.display='none'}
function answer(i,btn){if(answered)return;answered=true;done++;let ok=i===curQ.x;if(ok)right++;document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(j===curQ.x)b.classList.add('correct');if(j===i&&!ok)b.classList.add('wrong')});feedback.innerHTML=`<div class="feedback"><b>${ok?'答對':'答錯'}</b><br>${curQ.e}${!ok&&curQ.errorTags?.length?`<br><small>弱點標籤：${curQ.errorTags.join('、')}</small>`:''}</div>`;let ms=mastery(),k=curQ.motherId||curQ.id,r=ms[k]||{right:0,wrong:0,streak:0,last:0,tags:curQ.errorTags||[]};if(ok){r.right++;r.streak++}else{r.wrong++;r.streak=0}r.last=Date.now();r.tags=curQ.errorTags||r.tags;ms[k]=r;localStorage.setItem('mastery',JSON.stringify(ms));if(!ok){let w=read('wrongQuestions',[]);if(!w.includes(curQ.id)){w.push(curQ.id);localStorage.setItem('wrongQuestions',JSON.stringify(w))}}renderStats();nextBtn.style.display='block'}
function nextQuestion(){pos++;renderQ()}function renderStats(){doneN.textContent=done;rightN.textContent=right;rateN.textContent=done?Math.round(right/done*100)+'%':'—'}
function renderWrong(){let ids=read('wrongQuestions',[]),arr=ids.map(id=>Q.find(q=>q.id===id)).filter(Boolean);wrongList.innerHTML=arr.length?arr.map(q=>`<div class="box"><b>第${q.c+1}章｜${q.topic}</b><p>${q.q}</p><button class="secondary" onclick="retry('${q.id}')">重做</button></div>`).join(''):'<div class="empty">目前沒有錯題。</div>'}
function retry(id){let q=Q.find(x=>x.id===id);if(!q)return;pool=[q];practiceTitle.textContent='錯題重做';begin()}function clearWrong(){if(confirm('確定清除全部錯題？')){localStorage.setItem('wrongQuestions','[]');renderWrong()}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{if(b.dataset.page==='practice')startMode('scope');else{if(b.dataset.page==='scope')renderScope();go(b.dataset.page)}});window.addEventListener('popstate',()=>goBack());history.replaceState({page:'home'},'');renderScope();show('home');
</script></body></html>
